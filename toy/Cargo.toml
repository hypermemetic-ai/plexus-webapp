# SCAFFOLD-5: plexus-webapp's worked example — a service with one activation and a
# two-file app, the app embedded by this crate's build script and served by
# plexus-webapp's LocalServer. `cargo test -p plexus-webapp-toy` runs it;
# `cargo run -p plexus-webapp-toy` serves it until Ctrl-C. Never published.
[package]
name = "plexus-webapp-toy"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# The toy always embeds its app; the feature is here to show the switch an
# app uses (menger, for one, names it `embedded-app`).
default = ["embedded-app"]
embedded-app = []

[build-dependencies]
plexus-webapp = { path = "..", default-features = false, features = ["build"] }

[dependencies]
plexus-webapp = { path = ".." }
plexus-rpc = "0.11.0"
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]
axum = "0.8"
jsonrpsee = { version = "0.26", features = ["ws-client"] }
